  signal_ratio: 0.20
  borderline_ratio: 0.15
  personal_ratio: 0.15
  promo_ratio: 0.10
  total: 50

bait_templates:
  - "🔥🔥🔥 You won't BELIEVE what happened next! Like if you agree 👇"
  - "Retweet if you love crypto! FREE AIRDROP dm me 🚀🚀🚀"
  - "Hot take incoming 🧵 Follow for follow!!!"
  - "Smash that like button!!! Giveaway ending soon!!!"

signal_templates:
  - "Fed held rates steady at 5.25%. According to WSJ, markets rallied 2% on the news. Full analysis: https://example.com/fed"
  - "New research from MIT shows transformer efficiency gains plateau above 70B params. Data shows diminishing returns on pretraining scale."
  - "Breaking: EU passes AI Act enforcement timeline. Companies have 18 months to comply with transparency requirements."

borderline_templates:
  - "Interesting thread on market structure changes. Some good points but hard to verify without sources."
  - "My take on the latest policy shift — could go either way depending on implementation details."

personal_templates:
  - "Great coffee this morning. Ready for the day."
  - "Happy birthday to my colleague! Hope you have a wonderful celebration."

promo_templates:
  - "Check out our new product launch! Sign up today for early access. Link in bio."
  - "Subscribe to our newsletter for weekly updates on tech trends."

